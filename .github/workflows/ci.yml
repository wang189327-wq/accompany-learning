name: Source checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix cloud --ignore-scripts
      - run: npm run check:public
      - run: npm run format:check
      - run: npm test
      - run: npm run package:cloud
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-packages-${{ matrix.os }}
          path: cloud/release/*.zip
