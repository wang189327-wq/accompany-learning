plugins { id 'com.android.application' version '8.9.2' }
import groovy.json.JsonSlurper

// Distribution builds include SDKs but reject deployer credentials.
def pushConfig = new Properties()
def configFile = file('push.local.properties')
def distributionBuild = providers.gradleProperty('distribution').orElse('false').get().toBoolean()
if (distributionBuild && configFile.exists()) throw new GradleException('Distribution build cannot contain push.local.properties')
if (configFile.exists()) configFile.withInputStream { pushConfig.load(it) }
def configured = { String key -> !pushConfig.getProperty(key, '').trim().isEmpty() }
def requiredKeys = ['emasAppKey', 'emasAppSecret', 'huaweiAppId']
def pushConfigured = requiredKeys.every { configured(it) }
def vivoConfigured = configured('vivoAppId') && configured('vivoAppKey')

// Resource references keep numeric AppKeys typed as strings. Escape XML and
// Android resource syntax without logging any SDK credential values.
def resourceText = { String value ->
    value.replace('\\', '\\\\').replace("'", "\\'").replace('"', '\\"')
        .replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;')
}
def valuesFile = file('build/generated/push-res/values/push.xml')
valuesFile.parentFile.mkdirs()
valuesFile.setText('<resources>' +
    '<string name="emas_app_key" translatable="false">' + resourceText(pushConfig.getProperty('emasAppKey', '')) + '</string>' +
    '<string name="emas_app_secret" translatable="false">' + resourceText(pushConfig.getProperty('emasAppSecret', '')) + '</string>' +
    '</resources>', 'UTF-8')

def originalManifest = file('../AndroidManifest.xml').getText('UTF-8')
def packageName = (originalManifest =~ /package="([^"]+)"/)[0][1]
def manifestCode = (originalManifest =~ /android:versionCode="(\d+)"/)[0][1] as int
def manifestName = (originalManifest =~ /android:versionName="([^"]+)"/)[0][1]
def releaseCode = pushConfig.getProperty('pushVersionCode', manifestCode.toString()) as int
if (releaseCode < manifestCode) throw new GradleException('pushVersionCode cannot decrease')
def components = '''
<meta-data android:name="com.alibaba.app.appkey" android:value="@string/emas_app_key"/>
<meta-data android:name="com.alibaba.app.appsecret" android:value="@string/emas_app_secret"/>
<meta-data android:name="com.huawei.hms.client.appid" android:value="appid=${huaweiAppId}"/>
<activity android:name=".PushPopupActivity" android:exported="true" android:theme="@android:style/Theme.Translucent.NoTitleBar"/>
<receiver android:name=".PushReceiver" android:exported="false"><intent-filter>
<action android:name="com.alibaba.push2.action.NOTIFICATION_OPENED"/>
<action android:name="com.alibaba.push2.action.NOTIFICATION_REMOVED"/>
<action android:name="com.alibaba.sdk.android.push.RECEIVE"/>
</intent-filter></receiver>
'''
if (vivoConfigured) components += '''
<meta-data android:name="com.vivo.push.app_id" android:value="${vivoAppId}"/>
<meta-data android:name="com.vivo.push.api_key" android:value="${vivoAppKey}"/>
'''
def generatedManifest = file('build/generated/AndroidManifest.xml')
def manifestText = originalManifest.replaceFirst(/package="[^"]+"/, '')
    .replace('<application ', '<application android:name=".PushApplication" ')
    .replace('<uses-sdk', '<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-sdk')
    .replace('</application>', components + '</application>')
generatedManifest.parentFile.mkdirs()
generatedManifest.setText(manifestText, 'UTF-8')

def signingRoot = System.getenv('ACCOMPANY_SIGNING_ROOT') ?: System.getenv('C9_EXISTING_SIGNING_ROOT')
android {
    namespace packageName
    compileSdk 35
    defaultConfig {
        applicationId packageName
        minSdk 26
        targetSdk 35
        versionCode releaseCode
        versionName manifestName
        manifestPlaceholders = [huaweiAppId: pushConfig.getProperty('huaweiAppId', ''),
            vivoAppId: pushConfig.getProperty('vivoAppId', ''), vivoAppKey: pushConfig.getProperty('vivoAppKey', '')]
        buildConfigField 'boolean', 'PUSH_CONFIGURED', pushConfigured.toString()
        buildConfigField 'boolean', 'VIVO_PUSH_CONFIGURED', vivoConfigured.toString()
    }
    buildFeatures { buildConfig true }
    sourceSets.main {
        manifest.srcFile generatedManifest
        java.srcDirs = ['../src', 'src']
        res.srcDirs = ['../res', 'build/generated/push-res']
        assets.srcDirs = ['../build/assets']
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    signingConfigs {
        release {
            if (signingRoot) {
                def signingCredentials = new JsonSlurper().parse(new File(signingRoot, 'credentials.json'))
                storeFile new File(signingRoot, 'accompany-release.p12')
                storePassword signingCredentials.password
                keyPassword signingCredentials.password
                keyAlias 'accompanyrelease'
            }
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
    packaging { resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*'] }
}
dependencies {
    implementation 'com.aliyun.ams:alicloud-android-push:3.10.1'
    implementation 'com.aliyun.ams:alicloud-android-third-push:3.10.1'
    implementation 'com.aliyun.ams:alicloud-android-third-push-huawei:3.10.1'
    implementation 'com.aliyun.ams:alicloud-android-third-push-vivo:3.10.1'
}
tasks.register('checkPushRelease') {
    doLast {
        if (!distributionBuild) requiredKeys.each { key ->
            if (!configured(key)) throw new GradleException('Missing local push field: ' + key)
        }
        if (!signingRoot) throw new GradleException('Set ACCOMPANY_SIGNING_ROOT to original signing directory')
    }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach { dependsOn 'checkPushRelease' }
